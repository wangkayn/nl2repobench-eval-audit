name: reproduce

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  process-level-ab:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest -v
      - name: Check real-image harness syntax
        run: python -m py_compile docker_ab.py prepare_candidate_images.py
      - name: Print concise reproduction summary
        run: python reproduce.py --summary
